<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR whole-journey mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#0F1B24;--card:#17262F;--card2:#131F28;--line:#2B3D49;--line2:#3A4B57;--text:#EAF2F6;--mute:#9FB1BD;--soft:#C7D5DE;--red:#FF7A6B;--amber:#FFC857;--green:#6FD39A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
.h{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;color:#fff}
.kicker{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.crumb{font-size:14px;color:var(--mute)}
.crumb a{text-decoration:underline}
.crumb a:hover{color:#fff}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
nav.tabs a{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--soft);font-size:14px;font-weight:600}
nav.tabs a[aria-current=page]{background:#fff;color:#0F1B24;border-color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:4px 0;font-size:38px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pill b{font:700 28px 'Space Grotesk',Inter,sans-serif}
.pill span{font-size:14px;color:var(--soft)}
.g{color:var(--green)} .r{color:var(--red)}
.foot{margin-top:18px;font-size:13px;color:var(--mute);max-width:760px}
/* cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:26px;border-radius:20px;background:var(--card);border:2px solid var(--line2);min-height:230px}
.card.ward{min-height:170px;padding:22px;border-radius:18px;gap:20px}
a.card:hover{background:#1D3140;border-color:#4C6678}
.dash{background:var(--card2);border:2px dashed var(--line)}
.stats{display:flex;gap:40px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 60px/1 'Space Grotesk',Inter,sans-serif}
.ward .stat b{font-size:42px}
.stat span{font-size:14px;color:var(--soft)}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start}
.cardtitle{font:700 34px 'Space Grotesk',Inter,sans-serif;color:#fff}
.ward .cardtitle{font-size:28px}
.note{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:22px;border-radius:18px;border:2px solid var(--line);color:var(--mute);font-size:14px}
/* ward board */
.colheads,.row{display:grid;grid-template-columns:96px repeat(4,minmax(0,1fr)) 200px;column-gap:24px}
.colheads{margin-bottom:10px;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.row{align-items:stretch;min-height:80px;margin-bottom:10px}
.bed{display:flex;align-items:center;font:600 22px 'Space Grotesk',Inter,sans-serif;color:#fff}
.tw{position:relative;display:flex}
.tile{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 18px;min-height:80px;border-radius:14px;border:2px solid;cursor:pointer;text-align:left;font:700 22px 'Space Grotesk',Inter,sans-serif}
.tile .orgl{display:none;font:600 12px Inter,sans-serif;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.s-na{background:transparent;color:var(--mute);border-color:var(--line2)}
.s-wait{background:var(--red);color:#2A0603;border-color:var(--red)}
.s-work{background:var(--amber);color:#2B1E00;border-color:var(--amber)}
.s-ready{background:var(--green);color:#08261A;border-color:var(--green)}
.chev{position:absolute;right:-20px;top:28px}
.next{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.next i{width:12px;height:12px;border-radius:6px;flex:none}
.next strong{display:block;font-size:16px;color:#fff}
.next small{font-size:13px;color:var(--mute)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:6px;display:inline-block}
/* example */
.story{padding:18px 22px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:18px}
.story .t{font:700 26px 'Space Grotesk',Inter,sans-serif;color:#fff;margin:6px 0}
.story p{margin:0;font-size:16px;line-height:1.5;color:var(--soft)}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:28px;row-gap:18px;margin-bottom:18px}
.cell{position:relative;display:flex;flex-direction:column;gap:8px}
.cell .box{display:flex;align-items:center;height:84px;padding:0 18px;border-radius:14px;border:2px solid;font:700 22px 'Space Grotesk',Inter,sans-serif}
.cell .box.ring{box-shadow:0 0 0 4px #fff}
.cell .sees{font-size:13px;line-height:1.4;color:var(--mute)}
.cell .sees b{color:var(--soft)}
.cell .chev{top:52px;right:-22px}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:18px}
.info div{padding:16px 18px;border-radius:14px;border:1px solid var(--line);font-size:15px;line-height:1.5}
.info .kicker{display:block;margin-bottom:6px}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.btns{display:flex;align-items:center;gap:12px}
.btn{min-width:96px;min-height:48px;padding:0 20px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:600;border:2px solid #5E7382;background:transparent;color:var(--text)}
.btn.pri{background:#fff;color:#0F1B24;border-color:#fff;min-width:128px}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:4px}
.dot{width:24px;height:48px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot i{display:block;width:14px;height:14px;border-radius:7px;background:var(--line2)}
.dot[aria-current=step] i{background:#fff}
.badge{padding:8px 14px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);font-size:13px;font-weight:600}
@media (max-width:900px){
  h1{font-size:30px}
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .colheads{display:none}
  .row{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px;column-gap:12px;margin-bottom:22px}
  .row .bed,.row .next{grid-column:1/-1}
  .row .next{padding:12px 16px}
  .tile .orgl{display:block}
  .chev{display:none}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
  .cell .chev{display:none}
  .info{grid-template-columns:1fr}
  .stat b{font-size:48px}
}
@media (max-width:520px){
  .grid4{grid-template-columns:1fr}
  .wrap{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
<nav class="tabs" aria-label="Screens" id="tabs"></nav>
<div id="app"></div>
</div>

<script>
(function () {
  var ORGS = ['AFU', 'Social work', 'Community hospital', 'Care home'];
  var LABEL = { na: 'Not needed', wait: 'Waiting', work: 'Working on it', ready: 'Ready' };
  var DOT = { na: '#5E7382', wait: '#FF7A6B', work: '#FFC857', ready: '#6FD39A' };
  var NEXT = { na: 'wait', wait: 'work', work: 'ready', ready: 'wait' };

  /* Memory only: nothing is stored. Sample data throughout. */
  var rows = [
    { bed: 'Bed 1', tiles: ['ready', 'ready', 'ready', 'work'] },
    { bed: 'Bed 2', tiles: ['ready', 'work', 'wait', 'na'] },
    { bed: 'Bed 3', tiles: ['work', 'wait', 'na', 'na'] },
    { bed: 'Bed 4', tiles: ['ready', 'ready', 'na', 'ready'] },
    { bed: 'Bed 5', tiles: ['wait', 'na', 'na', 'na'] },
    { bed: 'Bed 6', tiles: ['ready', 'ready', 'ready', 'na'] }
  ];
  var OTHER_WARDS = [
    ['MAU', 5, 14], ['DME', 3, 9], ['Ward 4', 2, 7], ['Ward 5', 4, 6], ['Ward 7', 1, 8], ['Ward 9', 3, 5]
  ];
  var step = 0;

  var STEPS = [
    { when: 'Day 0 · Tuesday', title: 'Admitted to AFU',
      story: 'Mrs Example, 84, is admitted through ED to AFU after a fall at home. Only AFU has her on the board.',
      tiles: ['work', 'na', 'na', 'na'],
      sees: ['Full record, through Trak', 'Nothing yet', 'Nothing yet', 'Nothing yet'],
      taps: 'The AFU nurse taps AFU: Working on it.',
      replaces: 'Nothing yet. This is where the board starts.',
      question: 'What does AFU show the others on day 0? Probably nothing until a handoff is needed.' },
    { when: 'Day 1 · Wednesday', title: 'MDT: going home may not be safe',
      story: 'The MDT agrees she needs a social work assessment before any plan. The OT taps Social work: Waiting.',
      tiles: ['work', 'wait', 'na', 'na'],
      sees: ['Full record, through Trak', 'Name, date of birth, CHI number, reason for referral', 'Nothing yet', 'Nothing yet'],
      taps: 'The OT or charge nurse taps Social work: Waiting.',
      replaces: 'A referral email or phone call to the duty team, then a second call to check it was seen.',
      question: 'Social work needs to find her in their own system. Is name, date of birth and CHI allowed through this tool, or only a reference code?' },
    { when: 'Day 2 · Thursday', title: 'Social work picks it up',
      story: 'The duty social worker sees the request and starts the assessment. AFU can see it has been picked up.',
      tiles: ['work', 'work', 'na', 'na'],
      sees: ['Full record, through Trak', 'Name, date of birth, CHI number, reason for referral', 'Nothing yet', 'Nothing yet'],
      taps: 'The duty social worker taps Social work: Working on it.',
      replaces: 'A call back to say the referral was received.',
      question: 'Who in social work can tap: one named role, or anyone on the team?' },
    { when: 'Day 3 · Friday', title: 'Medically fit, community hospital bed needed',
      story: 'The medic says she can move on once a rehab bed is found. AFU taps Ready, and the community hospital tile goes to Waiting.',
      tiles: ['ready', 'work', 'wait', 'na'],
      sees: ['Full record, through Trak', 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'The medic or charge nurse taps AFU: Ready, then Community hospital: Waiting.',
      replaces: 'Bed request calls, often late on a Friday afternoon.',
      question: 'The community hospital sees a summary, not the notes. Who decides what goes in the summary?' },
    { when: 'Day 4 · Saturday', title: 'Weekend: bed confirmed',
      story: 'Social work completes the assessment and taps Ready. The community hospital accepts her and starts the transfer.',
      tiles: ['ready', 'ready', 'work', 'na'],
      sees: ['Full record, through Trak', 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'Social work taps Ready. The community hospital charge nurse taps Working on it.',
      replaces: 'Weekend calls asking whether the bed is confirmed, which often wait until Monday.',
      question: 'Does every partner have weekend cover to tap? A board only works if the other side updates it.' },
    { when: 'Day 5 · Sunday', title: 'Transfer day',
      story: 'Transport, medication and handover are agreed. The whole row is green, and AFU can see she is ready to go.',
      tiles: ['ready', 'ready', 'ready', 'na'],
      sees: ['Full record, through Trak', 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'The community hospital taps Ready once transport and handover are confirmed.',
      replaces: 'Calls to confirm the transport slot and the handover time.',
      question: 'Does AFU keep seeing her after she leaves? Probably not. Seeing less is safer.' },
    { when: 'Week 3 · Care home placement', title: 'A long-term place is agreed',
      story: 'Social work arranges a care home place while she is in rehab. The care home taps Ready when the room and handover are agreed, and she moves in.',
      tiles: ['ready', 'ready', 'ready', 'ready'],
      sees: ['No longer sees her', 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Name, age, care needs summary'],
      taps: 'The care home manager taps Care home: Ready.',
      replaces: 'Calls between the hospital, social work and the home to agree a date and what the home needs to know.',
      question: 'How long does each organisation keep seeing her? That needs a rule, not just a switch.' }
  ];

  var CHEV = '<svg class="chev" aria-hidden="true" width="16" height="24" viewBox="0 0 16 24"><path d="M4 4 L12 12 L4 20" fill="none" stroke="#5E7382" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV_BIG = '<svg aria-hidden="true" width="28" height="40" viewBox="0 0 16 24"><path d="M4 4 L12 12 L4 20" fill="none" stroke="#9FB1BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var VIEWS = ['borders', 'bgh', 'afu', 'example'];
  var view = 'borders';
  try {
    var h0 = (location.hash || '').replace('#', '');
    if (VIEWS.indexOf(h0) > -1) view = h0;
  } catch (err) { /* no hash access: stay on the first screen */ }

  function currentView() {
    return view;
  }

  function afuCounts() {
    var ready = 0, wait = 0;
    rows.forEach(function (r) {
      var open = false;
      r.tiles.forEach(function (s) {
        if (s === 'wait') wait += 1;
        if (s === 'wait' || s === 'work') open = true;
      });
      if (!open) ready += 1;
    });
    return { ready: ready, wait: wait };
  }

  function stat(n, label, cls) {
    return '<div class="stat"><b class="' + cls + '">' + n + '</b><span>' + label + '</span></div>';
  }

  function tabs(v) {
    var items = [['borders', '1. Borders'], ['bgh', '2. BGH wards'], ['afu', '3. AFU board'], ['example', '4. Worked example']];
    return items.map(function (it) {
      return '<a href="#' + it[0] + '"' + (v === it[0] ? ' aria-current="page"' : '') + '>' + it[1] + '</a>';
    }).join('');
  }

  function viewBorders() {
    var a = afuCounts();
    var bghReady = 18 + a.ready, bghWait = 49 + a.wait;
    function dashed(kicker, name, r, w) {
      return '<div class="card dash"><div><div class="kicker">' + kicker + '</div><div class="cardtitle">' + name + '</div></div><div class="stats">' + stat(r, 'ready to move', 'g') + stat(w, 'steps waiting', 'r') + '</div></div>';
    }
    return '<div class="top"><div><div class="kicker">RADAR Journey · Borders view</div><h1 class="h">NHS Borders</h1><div class="mute">Where patients are waiting on a next step. Tap an area to go in.</div></div><span class="badge">Mockup · sample data</span></div>' +
      '<div class="grid2">' +
      '<a class="card" href="#bgh" aria-label="Borders General Hospital, ' + bghReady + ' ready to move, ' + bghWait + ' steps waiting. Open wards."><div class="cardtop"><div><div class="kicker">Acute hospital · 7 wards</div><div class="cardtitle">BGH</div></div>' + CHEV_BIG + '</div><div class="stats">' + stat(bghReady, 'ready to move', 'g') + stat(bghWait, 'steps waiting', 'r') + '</div></a>' +
      dashed('Community', 'Community hospitals', 6, 11) +
      dashed('Health and social care partnership', 'Social work', 3, 12) +
      dashed('Independent and private sector', 'Care homes', 4, 3) +
      '</div><div class="foot">Counts only at this level, no bed or patient detail. Only BGH opens in this mockup; dashed areas would follow the same pattern. BGH updates live from the AFU board.</div>';
  }

  function viewBgh() {
    var a = afuCounts();
    var bghReady = 18 + a.ready, bghWait = 49 + a.wait;
    var wards = '<a class="card ward" href="#afu" aria-label="AFU, ' + a.ready + ' ready to move, ' + a.wait + ' steps waiting. Open ward board."><div class="cardtop"><div class="cardtitle">AFU</div>' + CHEV_BIG + '</div><div class="stats">' + stat(a.ready, 'ready to move', 'g') + stat(a.wait, 'steps waiting', 'r') + '</div></a>';
    OTHER_WARDS.forEach(function (w) {
      wards += '<div class="card ward dash"><div class="cardtitle">' + w[0] + '</div><div class="stats">' + stat(w[1], 'ready to move', 'g') + stat(w[2], 'steps waiting', 'r') + '</div></div>';
    });
    wards += '<div class="note"><strong style="color:#C7D5DE">How to read this</strong><span>Wards stay in a fixed order. Nothing is ranked or scored: it shows where steps are waiting, not who is doing badly.</span></div>';
    return '<div class="top"><div><div class="crumb"><a href="#borders">NHS Borders</a> › BGH</div><h1 class="h">BGH wards</h1><div class="mute">Tap a ward to see its beds and who owns the next step.</div></div><div class="pills"><div class="pill"><b class="g">' + bghReady + '</b><span>ready to move</span></div><div class="pill"><b class="r">' + bghWait + '</b><span>steps waiting</span></div></div></div>' +
      '<div class="grid4">' + wards + '</div><div class="foot">Sample numbers for the mockup. The AFU counts come from the ward board. Other wards would open their own boards in the same pattern.</div>';
  }

  function viewAfu() {
    var a = afuCounts();
    var html = '<div class="top"><div><div class="crumb"><a href="#borders">NHS Borders</a> › <a href="#bgh">BGH</a> › AFU</div><h1 class="h">AFU journey board</h1><div class="mute">Tap a tile to move it on. One tap, one owner.</div></div><div class="pills"><div class="pill"><b class="g">' + a.ready + '</b><span>ready to move</span></div><div class="pill"><b class="r">' + a.wait + '</b><span>steps waiting</span></div></div></div>';
    html += '<div class="colheads"><div>Bed</div>' + ORGS.map(function (o) { return '<div>' + o + '</div>'; }).join('') + '<div>Next step</div></div>';
    rows.forEach(function (r, ri) {
      var openIdx = -1;
      for (var k = 0; k < 4; k++) { if (r.tiles[k] === 'wait' || r.tiles[k] === 'work') { openIdx = k; break; } }
      var done = openIdx === -1;
      var openState = done ? 'ready' : r.tiles[openIdx];
      html += '<div class="row"><div class="bed">' + r.bed + '</div>';
      r.tiles.forEach(function (s, ti) {
        html += '<div class="tw"><button class="tile s-' + s + '" data-r="' + ri + '" data-t="' + ti + '" aria-label="' + r.bed + ', ' + ORGS[ti] + ': ' + LABEL[s] + '. Tap to change."><span class="orgl">' + ORGS[ti] + '</span>' + LABEL[s] + '</button>' + (ti < 3 ? CHEV : '') + '</div>';
      });
      html += '<div class="next"><i style="background:' + DOT[openState] + '"></i><div><strong>' + (done ? 'Ready to move' : ORGS[openIdx]) + '</strong><small>' + (done ? 'Every step is done' : LABEL[openState]) + '</small></div></div></div>';
    });
    html += '<div class="legend" style="margin-top:8px"><span><i style="background:#FF7A6B"></i>Waiting</span><span><i style="background:#FFC857"></i>Working on it</span><span><i style="background:#6FD39A"></i>Ready</span><span><i style="border:2px solid #5E7382"></i>Not needed</span></div>';
    html += '<div class="foot">Bed level only. No names, no NHS numbers, nothing typed. One tap per step, one owner per tile. Nothing is stored: reload and it resets.</div>';
    return html;
  }

  function viewExample() {
    var cur = STEPS[step], prev = step > 0 ? STEPS[step - 1] : null, last = STEPS.length - 1;
    var html = '<div class="top"><div><div class="crumb"><a href="#borders">NHS Borders</a> › Worked example</div><h1 class="h">One journey, start to finish</h1></div><span class="badge">Fictional patient · illustrative only</span></div>';
    html += '<div class="story"><div class="kicker">Step ' + (step + 1) + ' of ' + STEPS.length + ' · ' + cur.when + '</div><div class="t">' + cur.title + '</div><p>' + cur.story + '</p></div>';
    html += '<div class="chain">';
    cur.tiles.forEach(function (s, t) {
      var ring = prev && prev.tiles[t] !== s ? ' ring' : '';
      html += '<div class="cell"><div class="kicker">' + ORGS[t] + '</div><div class="box s-' + s + ring + '">' + LABEL[s] + '</div><div class="sees"><b>Sees:</b> ' + cur.sees[t] + '</div>' + (t < 3 ? CHEV.replace('class="chev"', 'class="chev"') : '') + '</div>';
    });
    html += '</div>';
    html += '<div class="info"><div><span class="kicker g">Who taps</span>' + cur.taps + '</div><div><span class="kicker" style="color:#FFC857">Replaces today (a hypothesis to test)</span>' + cur.replaces + '</div><div><span class="kicker r">Open design question</span>' + cur.question + '</div></div>';
    html += '<div class="stepper"><div class="foot" style="margin:0">Not evidence of results. The replaces lines are hypotheses, to be checked with a real chasing tally at the handoff.</div><div class="btns"><button class="btn" id="back"' + (step === 0 ? ' disabled' : '') + ' aria-label="Previous step">Back</button><div class="dots">' +
      STEPS.map(function (x, n) { return '<button class="dot" data-step="' + n + '" aria-label="Go to step ' + (n + 1) + ' of ' + STEPS.length + '"' + (n === step ? ' aria-current="step"' : '') + '><i></i></button>'; }).join('') +
      '</div><button class="btn pri" id="next">' + (step === last ? 'Start again' : 'Next') + '</button></div></div>';
    return html;
  }

  function render(focusSel) {
    var v = currentView();
    document.getElementById('tabs').innerHTML = tabs(v);
    var app = document.getElementById('app');
    app.innerHTML = v === 'borders' ? viewBorders() : v === 'bgh' ? viewBgh() : v === 'afu' ? viewAfu() : viewExample();
    if (focusSel) {
      var el = document.querySelector(focusSel);
      if (el) el.focus();
    }
  }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('a[href^="#"]');
    if (nav) {
      var name = nav.getAttribute('href').replace('#', '');
      if (VIEWS.indexOf(name) > -1) {
        e.preventDefault();
        view = name;
        try { history.replaceState(null, '', '#' + name); } catch (err) { /* ignore */ }
        render();
        window.scrollTo(0, 0);
      }
      return;
    }
    var tile = e.target.closest('[data-r]');
    if (tile) {
      var r = +tile.getAttribute('data-r'), t = +tile.getAttribute('data-t');
      rows[r].tiles[t] = NEXT[rows[r].tiles[t]];
      render('[data-r="' + r + '"][data-t="' + t + '"]');
      return;
    }
    var dot = e.target.closest('[data-step]');
    if (dot) { step = +dot.getAttribute('data-step'); render('[data-step="' + step + '"]'); return; }
    if (e.target.closest('#back')) { if (step > 0) step -= 1; render('#back'); return; }
    if (e.target.closest('#next')) { step = step === STEPS.length - 1 ? 0 : step + 1; render('#next'); return; }
  });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (VIEWS.indexOf(h) > -1 && h !== view) { view = h; render(); window.scrollTo(0, 0); }
  });
  render();
})();
</script>
</body>
</html>
