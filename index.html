<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR whole-journey mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#0F1B24;--card:#17262F;--card2:#131F28;--line:#2B3D49;--line2:#3A4B57;--text:#EAF2F6;--mute:#9FB1BD;--soft:#C7D5DE;--red:#FF7A6B;--amber:#FFC857;--green:#6FD39A;--beam:#6FD39A;--hi:#fff;--cardh:#1D3140;--cardhb:#4C6678}
[data-theme=light]{--beam:#1E9E5A;--bg:#F2F6F8;--card:#fff;--card2:#EAF0F4;--line:#D3DDE4;--line2:#AFBFCB;--text:#12212B;--mute:#4A6070;--soft:#2A3F4E;--hi:#0F1B24;--cardh:#E8F0F5;--cardhb:#7E97A8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:3px}
.wrap{max-width:1560px;margin:0 auto;padding:24px}
.h{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;color:var(--hi)}
.kicker{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.crumb{font-size:14px;color:var(--mute)}
.crumb a{text-decoration:underline}
.crumb a:hover{color:var(--hi)}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
nav.tabs a{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--soft);font-size:14px;font-weight:600}
nav.tabs a[aria-current=page]{background:var(--hi);color:var(--bg);border-color:var(--hi)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:4px 0;font-size:38px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pill b{font:700 28px 'Space Grotesk',Inter,sans-serif}
.pill span{font-size:14px;color:var(--soft)}
.g{color:var(--green)} .r{color:var(--red)}
.foot{margin-top:18px;font-size:13px;color:var(--mute);max-width:760px}
/* cards */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:26px;border-radius:20px;background:var(--card);border:2px solid var(--line2);min-height:230px}
.card.ward{min-height:170px;padding:22px;border-radius:18px;gap:20px}
a.card:hover{background:var(--cardh);border-color:var(--cardhb)}
.stats{display:flex;gap:40px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:700 60px/1 'Space Grotesk',Inter,sans-serif}
.ward .stat b{font-size:42px}
.stat span{font-size:14px;color:var(--soft)}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start}
.cardtitle{font:700 34px 'Space Grotesk',Inter,sans-serif;color:var(--hi)}
.ward .cardtitle{font-size:28px}
.note{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:22px;border-radius:18px;border:2px solid var(--line);color:var(--mute);font-size:14px}
/* boards */
.colheads,.row{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr)) 200px;column-gap:24px}
.colheads{margin-bottom:10px;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.row{align-items:stretch;min-height:80px;margin-bottom:10px}
.bed{display:flex;align-items:center;font:600 20px 'Space Grotesk',Inter,sans-serif;color:var(--hi)}
.bedbtn{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 0;margin:0;border:0;background:transparent;color:var(--hi);font:600 20px 'Space Grotesk',Inter,sans-serif;cursor:pointer;text-align:left;border-radius:8px}
.bedbtn:hover{color:var(--soft)}
.caret{display:inline-block;font-size:24px;line-height:1;color:var(--mute);transition:transform .15s}
.caret.on{transform:rotate(90deg)}
.tree{margin:-2px 0 18px 134px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.tree ul{list-style:none;margin:0;padding:0 0 0 22px}
.tree>ul{padding-left:0}
.tree li{position:relative;padding:4px 0 4px 20px}
.tree>ul>li{padding-left:0}
.tree li li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line2)}
.tree li li:last-child::before{bottom:auto;height:20px}
.tree li li::after{content:"";position:absolute;left:0;top:20px;width:16px;border-top:2px solid var(--line2)}
.node{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;border:2px solid;font-size:14px;font-weight:600}
.node.poss{border-style:dashed}
.tree .cap{margin-top:10px;font-size:13px;color:var(--mute)}
.ptree{margin:26px 0 0 0;padding:20px 22px}
.ptree .kicker{margin-bottom:12px}
.node.pn{background:var(--card);border-color:var(--line2);color:var(--hi);flex-wrap:wrap;font-size:15px;padding:8px 12px}
.node.pn.poss{background:transparent;color:var(--mute);border-color:var(--line2)}
.chip{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.w{background:var(--red);color:#2A0603}
.chip.k{background:var(--amber);color:#2B1E00}
.chip.d{background:var(--green);color:#08261A}
.chip.z{background:transparent;color:var(--mute);border:1px solid var(--line2)}
.ptree2{margin-top:26px;padding:20px 22px;border:1px solid var(--line);border-radius:20px;background:var(--card2)}
.ptree2 .kicker{margin-bottom:12px}
.pscroll{overflow-x:auto}
.pscroll svg{display:block;min-width:900px;width:100%;height:auto}
.pscroll a:hover rect.nb{stroke:var(--hi)}
.cap2{margin-top:12px;font-size:13px;color:var(--mute);max-width:840px}
.pulse{fill:none;stroke:#FF7A6B;stroke-width:3;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.15}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.tw{position:relative;display:flex}
.tile{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 18px;min-height:80px;border-radius:14px;border:2px solid;cursor:pointer;text-align:left;font:700 22px 'Space Grotesk',Inter,sans-serif}
.tile .orgl{display:none;font:600 12px Inter,sans-serif;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.s-na{background:transparent;color:var(--mute);border-color:var(--line2)}
.s-wait{background:var(--red);color:#2A0603;border-color:var(--red)}
.s-work{background:var(--amber);color:#2B1E00;border-color:var(--amber)}
.s-ready{background:var(--green);color:#08261A;border-color:var(--green)}
.chev{position:absolute;right:-20px;top:28px}
.next{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.next i{width:12px;height:12px;border-radius:6px;flex:none}
.next strong{display:block;font-size:16px;color:var(--hi)}
.next small{font-size:13px;color:var(--mute)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:6px;display:inline-block}
/* example */
.story{padding:18px 22px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:18px}
.story .t{font:700 26px 'Space Grotesk',Inter,sans-serif;color:var(--hi);margin:6px 0}
.story p{margin:0;font-size:16px;line-height:1.5;color:var(--soft)}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:28px;row-gap:18px;margin-bottom:18px}
.cell{position:relative;display:flex;flex-direction:column;gap:8px}
.cell .box{display:flex;align-items:center;height:84px;padding:0 18px;border-radius:14px;border:2px solid;font:700 22px 'Space Grotesk',Inter,sans-serif}
.cell .box.ring{box-shadow:0 0 0 4px var(--hi)}
.cell .sees{font-size:13px;line-height:1.4;color:var(--mute)}
.cell .sees b{color:var(--soft)}
.cell .chev{top:52px;right:-22px}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:18px}
.info div{padding:16px 18px;border-radius:14px;border:1px solid var(--line);font-size:15px;line-height:1.5}
.info .kicker{display:block;margin-bottom:6px}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.btns{display:flex;align-items:center;gap:12px}
.btn{min-width:96px;min-height:48px;padding:0 20px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:600;border:2px solid #5E7382;background:transparent;color:var(--text)}
.btn.pri{background:var(--hi);color:var(--bg);border-color:var(--hi);min-width:128px}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:4px}
.dot{width:24px;height:48px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot i{display:block;width:14px;height:14px;border-radius:7px;background:var(--line2)}
.dot[aria-current=step] i{background:var(--hi)}
.badge{padding:8px 14px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);font-size:13px;font-weight:600}
@media (max-width:900px){
  h1{font-size:30px}
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .colheads{display:none}
  .row{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px;column-gap:12px;margin-bottom:22px}
  .row .bed,.row .next{grid-column:1/-1}
  .row .next{padding:12px 16px}
  .tree{margin-left:0}
  .tile .orgl{display:block}
  .chev{display:none}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
  .cell .chev{display:none}
  .info{grid-template-columns:1fr}
  .stat b{font-size:48px}
}
@media (max-width:520px){
  .grid4{grid-template-columns:1fr}
  .wrap{padding:16px}
}
[data-theme=light] .badge{color:#8A5A00;border-color:#C98A00}
.dash{display:grid;grid-template-columns:1fr;grid-template-areas:'tiles' 'tree';gap:20px}
.dash>.grid2{grid-area:tiles}
.dash>.ptree2{grid-area:tree;margin-top:0}
@media (min-width:1100px){
  .dash{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);grid-template-areas:'tree tiles';align-items:start}
  .dash>.grid2{grid-template-columns:1fr;gap:10px}
  .dash .card{min-height:0;padding:12px 18px;gap:6px;border-radius:16px}
  .dash .cardtitle{font-size:22px}
  .dash .stat b{font-size:32px}
  .dash .stats{gap:28px}
  .dash .cardtop svg{width:18px;height:26px}
}
@media (min-width:1400px){
  .dash>.grid2{grid-template-columns:1fr 1fr}
  .dash .card{padding:12px 14px}
  .dash .cardtitle{font-size:19px}
  .dash .stat b{font-size:28px}
  .dash .stats{gap:16px}
  .dash .stat span{font-size:12px}
  .dash .kicker{font-size:11px;letter-spacing:.6px}
}
.theme{position:fixed;right:14px;bottom:14px;z-index:5;padding:10px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="wrap">
<nav class="tabs" aria-label="Screens" id="tabs"></nav>
<div id="app"></div>
<button class="theme" id="theme" type="button">Light mode</button>
</div>

<script>
(function () {
  var ORGS = ['AFU', 'Social work', 'Community hospital', 'Care home'];
  var LABEL = { na: 'Not needed', wait: 'Waiting', work: 'Working on it', ready: 'Ready' };
  var DOT = { na: '#5E7382', wait: '#FF7A6B', work: '#FFC857', ready: '#6FD39A' };
  var NEXT = { na: 'wait', wait: 'work', work: 'ready', ready: 'wait' };

  /* Memory only: nothing is stored. Every board is sample data. */
  function makeBoard(name, parent, cols, prefix, letters, states, sub, foot) {
    var labels = states.map(function (s, i) { return prefix + ' ' + (letters ? 'ABCDEFGH'.charAt(i) : (i + 1)); });
    return { name: name, parent: parent, cols: cols, labels: labels, rows: states.map(function (s) { return s.slice(); }), sub: sub, foot: foot };
  }

  var WARD_SUB = 'Tap a tile to move it on. One tap, one owner.';
  var WARD_FOOT = 'Bed level only. No names, no NHS numbers, nothing typed. One tap per step, one owner per tile. Sample data. Nothing is stored: reload and it resets.';
  var REF_FOOT = 'Sample board. In real use, how a referral is identified is an open IG question. One tap per step, one owner per tile. Nothing is stored: reload and it resets.';

  function genRows(n, mod) {
    var rows = [];
    for (var i = 0; i < n; i++) {
      var stage = (i * 3 + (i >> 2) + mod) % 5, r = [];
      for (var k = 0; k < 4; k++) {
        if (k < stage) r.push('ready');
        else if (k === stage) r.push(i % 3 === 0 ? 'wait' : 'work');
        else r.push('na');
      }
      rows.push(r);
    }
    return rows;
  }
  var HF_ROWS = genRows(34, 0), HAH_ROWS = genRows(24, 2), POC_ROWS = genRows(56, 1);

  var BOARDS = {
    afu: makeBoard('AFU', 'bgh', ORGS, 'Bed', false, [
      ['ready', 'ready', 'ready', 'work'], ['ready', 'work', 'wait', 'na'], ['work', 'wait', 'na', 'na'],
      ['ready', 'ready', 'na', 'ready'], ['wait', 'na', 'na', 'na'], ['ready', 'ready', 'ready', 'na']
    ], WARD_SUB, WARD_FOOT),
    mau: makeBoard('MAU', 'bgh', ORGS, 'Bed', false, [
      ['work', 'na', 'na', 'na'], ['ready', 'work', 'na', 'na'], ['ready', 'ready', 'wait', 'na'],
      ['wait', 'na', 'na', 'na'], ['ready', 'ready', 'ready', 'na'], ['work', 'wait', 'na', 'na']
    ], WARD_SUB, WARD_FOOT),
    dme: makeBoard('DME', 'bgh', ORGS, 'Bed', false, [
      ['ready', 'ready', 'work', 'na'], ['work', 'work', 'na', 'na'], ['ready', 'wait', 'na', 'na'],
      ['ready', 'ready', 'na', 'work'], ['wait', 'na', 'na', 'na'], ['ready', 'ready', 'ready', 'na']
    ], WARD_SUB, WARD_FOOT),
    ward4: makeBoard('Ward 4', 'bgh', ORGS, 'Bed', false, [
      ['ready', 'na', 'na', 'na'], ['work', 'wait', 'na', 'na'], ['ready', 'ready', 'wait', 'na'],
      ['wait', 'na', 'na', 'na'], ['ready', 'ready', 'ready', 'ready'], ['work', 'na', 'na', 'na']
    ], WARD_SUB, WARD_FOOT),
    ward5: makeBoard('Ward 5', 'bgh', ORGS, 'Bed', false, [
      ['ready', 'ready', 'ready', 'na'], ['ready', 'work', 'na', 'na'], ['work', 'na', 'na', 'na'],
      ['ready', 'ready', 'work', 'na'], ['wait', 'wait', 'na', 'na'], ['ready', 'na', 'na', 'ready']
    ], WARD_SUB, WARD_FOOT),
    ward7: makeBoard('Ward 7', 'bgh', ORGS, 'Bed', false, [
      ['wait', 'na', 'na', 'na'], ['work', 'wait', 'na', 'na'], ['ready', 'wait', 'wait', 'na'],
      ['ready', 'work', 'na', 'na'], ['wait', 'na', 'na', 'na'], ['ready', 'ready', 'na', 'wait']
    ], WARD_SUB, WARD_FOOT),
    ward9: makeBoard('Ward 9', 'bgh', ORGS, 'Bed', false, [
      ['ready', 'ready', 'ready', 'na'], ['ready', 'ready', 'work', 'na'], ['work', 'na', 'na', 'na'],
      ['ready', 'work', 'na', 'na'], ['ready', 'ready', 'ready', 'ready'], ['wait', 'na', 'na', 'na']
    ], WARD_SUB, WARD_FOOT),
    community: makeBoard('Community hospitals', null, ['Bed request', 'Accepted', 'Transport', 'Handover'], 'Referral', true, [
      ['work', 'na', 'na', 'na'], ['ready', 'work', 'na', 'na'], ['ready', 'ready', 'wait', 'na'],
      ['ready', 'ready', 'ready', 'work'], ['ready', 'ready', 'ready', 'ready'], ['wait', 'na', 'na', 'na']
    ], 'Referrals coming in from the acute wards. Tap a tile to move it on.', REF_FOOT),
    social: makeBoard('Social work', null, ['Picked up', 'Assessment', 'Package or placement', 'Handover'], 'Referral', true, [
      ['wait', 'na', 'na', 'na'], ['ready', 'work', 'na', 'na'], ['ready', 'ready', 'work', 'na'],
      ['ready', 'ready', 'wait', 'na'], ['ready', 'ready', 'ready', 'work'], ['ready', 'ready', 'ready', 'ready']
    ], 'Referrals from the wards and what has happened to each. Tap a tile to move it on.', REF_FOOT),
    carehomes: makeBoard('Care homes', null, ['Enquiry', 'Room agreed', 'Needs summary', 'Moved in'], 'Placement', true, [
      ['work', 'na', 'na', 'na'], ['ready', 'work', 'na', 'na'], ['ready', 'ready', 'wait', 'na'],
      ['ready', 'ready', 'ready', 'work'], ['ready', 'ready', 'ready', 'ready'], ['wait', 'na', 'na', 'na']
    ], 'Placements being arranged. Tap a tile to move it on.', REF_FOOT),
    homefirst: makeBoard('Home First', null, ['Referral accepted', 'Home visit booked', 'Support in place', 'Settled at home'], 'Place', false, HF_ROWS,
      HF_ROWS.length + ' of 40 places in use. Tap a tile to move it on.', REF_FOOT),
    hah: makeBoard('Hospital at Home', null, ['Accepted', 'Set up at home', 'Daily review', 'Discharged from H@H'], 'Place', false, HAH_ROWS,
      HAH_ROWS.length + ' of 30 places in use. Tap a tile to move it on.', REF_FOOT)
  };
  BOARDS.poc = makeBoard('Long-term package of care', null, ['Referral', 'Assessment', 'Provider found', 'Care started'], 'Referral', false, POC_ROWS,
    POC_ROWS.length + ' people waiting on or moving through a long-term package. Tap a tile to move it on.', REF_FOOT);
  BOARDS.homefirst.cap = 40;
  BOARDS.hah.cap = 30;
  var WARD_IDS = ['afu', 'mau', 'dme', 'ward4', 'ward5', 'ward7', 'ward9'];
  var step = 0;
  var expanded = {};

  var AFU_SEES = 'Full clinical context in Trak, separately from RADAR; bed readiness only on RADAR';

  var STEPS = [
    { when: 'Day 0 · Tuesday', title: 'Admitted to AFU',
      story: 'Mrs Example, 84, is admitted through ED to AFU after a fall at home. Only AFU has her on the board.',
      tiles: ['work', 'na', 'na', 'na'],
      sees: [AFU_SEES, 'Nothing yet', 'Nothing yet', 'Nothing yet'],
      taps: 'The AFU nurse taps AFU: Working on it.',
      replaces: 'Nothing yet. This is where the board starts.',
      question: 'What does AFU show the others on day 0? Probably nothing until a handoff is needed.' },
    { when: 'Day 1 · Wednesday', title: 'MDT: going home may not be safe',
      story: 'The MDT agrees she needs a social work assessment before any plan. The OT taps Social work: Waiting.',
      tiles: ['work', 'wait', 'na', 'na'],
      sees: [AFU_SEES, 'Name, date of birth, CHI number, reason for referral', 'Nothing yet', 'Nothing yet'],
      taps: 'The OT or charge nurse taps Social work: Waiting.',
      replaces: 'A referral email or phone call to the duty team, then a second call to check it was seen.',
      question: 'Social work needs to find her in their own system. Is name, date of birth and CHI allowed through this tool, or only a reference code?' },
    { when: 'Day 2 · Thursday', title: 'Social work picks it up',
      story: 'The duty social worker sees the request and starts the assessment. AFU can see it has been picked up.',
      tiles: ['work', 'work', 'na', 'na'],
      sees: [AFU_SEES, 'Name, date of birth, CHI number, reason for referral', 'Nothing yet', 'Nothing yet'],
      taps: 'The duty social worker taps Social work: Working on it.',
      replaces: 'A call back to say the referral was received.',
      question: 'Who in social work can tap: one named role, or anyone on the team?' },
    { when: 'Day 3 · Friday', title: 'Medically fit, community hospital bed needed',
      story: 'The medic says she can move on once a rehab bed is found. AFU taps Ready, and the community hospital tile goes to Waiting.',
      tiles: ['ready', 'work', 'wait', 'na'],
      sees: [AFU_SEES, 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'The medic or charge nurse taps AFU: Ready, then Community hospital: Waiting.',
      replaces: 'Bed request calls, often late on a Friday afternoon.',
      question: 'The community hospital sees a summary, not the notes. Who decides what goes in the summary?' },
    { when: 'Day 4 · Saturday', title: 'Weekend: bed confirmed',
      story: 'Social work completes the assessment and taps Ready. The community hospital accepts her and starts the transfer.',
      tiles: ['ready', 'ready', 'work', 'na'],
      sees: [AFU_SEES, 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'Social work taps Ready. The community hospital charge nurse taps Working on it.',
      replaces: 'Weekend calls asking whether the bed is confirmed, which often wait until Monday.',
      question: 'Does every partner have weekend cover to tap? A board only works if the other side updates it.' },
    { when: 'Day 5 · Sunday', title: 'Transfer day',
      story: 'Transport, medication and handover are agreed. The whole row is green, and AFU can see she is ready to go.',
      tiles: ['ready', 'ready', 'ready', 'na'],
      sees: [AFU_SEES, 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Nothing yet'],
      taps: 'The community hospital taps Ready once transport and handover are confirmed.',
      replaces: 'Calls to confirm the transport slot and the handover time.',
      question: 'Does AFU keep seeing her after she leaves? Probably not. Seeing less is safer.' },
    { when: 'Week 3 · Care home placement', title: 'A long-term place is agreed',
      story: 'Social work arranges a care home place while she is in rehab. The care home taps Ready when the room and handover are agreed, and she moves in.',
      tiles: ['ready', 'ready', 'ready', 'ready'],
      sees: ['No longer sees her', 'Name, date of birth, CHI number, reason for referral', 'Name, age, reason for transfer, mobility and readiness only', 'Name, age, care needs summary'],

  function render(focusSel) {

  document.addEventListener('click', function (e) {

    if (dot) { step = +dot.getAttribute('data-step'); render('[data-step="' + step + '"]'); return; }
    if (e.target.closest('#back')) { if (step > 0) step -= 1; render('#back'); return; }
    if (e.target.closest('#next')) { step = step === STEPS.length - 1 ? 0 : step + 1; render('#next'); return; }
  });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace('#', '');
    if (VIEWS.indexOf(h) > -1 && h !== view) { view = h; render(); window.scrollTo(0, 0); }
  });
  render();
})();
</script>
</body>
</html>
